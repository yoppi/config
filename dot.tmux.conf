set -g default-terminal "screen-256color"

set -g set-titles off
setw -g automatic-rename off
set -sg escape-time 1

# prefix
unbind-key C-b
set-option -g prefix C-k
bind-key C-k send-prefix

# reload setting
bind r source-file ~/.tmux.conf

# copy mode like vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# window
bind p last-window
bind j next-window
bind Space next-window
bind k previous-window
bind | split-window -h
bind - split-window -v
bind-key -r < swap-window -t -1\; select-window -t -1
bind-key -r > swap-window -t +1\; select-window -t +1

# scroll size
set-option -g history-limit 65535

# pane
set-option -g base-index 0

# status line
#set-option -g status-position top
set-window-option -g window-status-current-format '#{?window_zoomed_flag,#[bg=colour226#,fg=colour235] #I #W #[default], #I #W }'
set-window-option -g window-status-format ' #I #W '
set -g status-right '#(~/bin/tmux-claude-status)'
set -g status-interval 1

# zoomed pane border
set-hook -g after-resize-pane "if-shell -F '#{window_zoomed_flag}' 'set pane-active-border-style fg=colour226' 'set pane-active-border-style fg=colour240'"

#### COLOUR (Solarized 256)

# default statusbar colors
set-option -g status-style bg=colour235,fg=colour118

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=default
#set-window-option -g window-status-attr dim

# active window title colors
set-window-option -g window-status-current-style fg=colour154,bg=default

# pane border
set-option -g pane-border-style fg=colour235
# message text
set-option -g message-style bg=colour235,fg=colour33

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour34

# clock
set-window-option -g clock-mode-colour colour64 #green
